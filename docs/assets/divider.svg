<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 24" width="1280" height="24" role="presentation">
  <style>
    .run { animation: run 3.2s linear infinite; }
    @keyframes run { from { transform: translateX(-220px); } to { transform: translateX(1280px); } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1">
      <stop offset="0" stop-color="#fcee0a" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fcee0a" stop-opacity="1"/>
      <stop offset="1" stop-color="#00e5f0" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1280" height="2" fill="#fcee0a" fill-opacity=".18"/>
  <rect class="run" x="0" y="10" width="220" height="4" fill="url(#g)"/>
  <rect x="0" y="6" width="56" height="12" fill="#fcee0a"/>
  <rect x="62" y="6" width="10" height="12" fill="#fcee0a"/>
  <rect x="1208" y="9" width="72" height="6" fill="#fcee0a" fill-opacity=".6"/>
</svg>
